name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - run: npm install

      - run: pip install -r requirements.txt

      - run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test
        continue-on-error: true

      - name: Generate Node summary
        run: npm run summary
        if: always()

      - name: Generate Python summary
        run: npm run summary:python
        if: always()

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report.json

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: summary
          path: test-summary.txt

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: python-summary
          path: test-summary-python.txt

      - name: Propagate test failure
        if: steps.playwright.outcome == 'failure'
        run: exit 1