jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx playwright install --with-deps

      - name: Run tests
        env:
          TESTRELIC_API_KEY: ${{ secrets.TESTRELIC_API_KEY }}
        run: npx playwright test