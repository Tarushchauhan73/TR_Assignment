name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt in to Node 24 now

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: npx playwright install --with-deps

      # Run tests (generates playwright-report.json via reporter config)
      - run: npm run ci
        continue-on-error: true   # don't abort — let summaries still run

      # Generate Node summary → test-summary.txt
      - run: npm run summary
        if: always()

      # Generate Python summary → test-summary-python.txt
      - run: npm run summary:python
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: test-summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-summary
          path: test-summary-python.txt