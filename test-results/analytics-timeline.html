  /* ── Console Log Level Colors & Labels ── */
  var LOG_COLORS={log:'#9ca3af',warn:'#fbbf24',error:'#f87171',info:'#60a5fa',debug:'#a78bfa',stdout:'#9ca3af',stderr:'#f87171'};
  var LOG_LABELS={log:'LOG',warn:'WARN',error:'ERR',info:'INFO',debug:'DBG',stdout:'OUT',stderr:'ERR'};

  function consoleVideoOffset(entry,baseTime){
    if(!baseTime||!entry.timestamp)return -1;
    var t=Date.parse(entry.timestamp);
    if(isNaN(t))return -1;
    var off=(t-baseTime)/1000;
    return off>=0?off:-1;
  }

  function renderConsoleLogEntry(entry,hasVideo,baseTime){
    var off=hasVideo?consoleVideoOffset(entry,baseTime):-1;
    var seekable=off>=0;
    var h='<div class="console-entry console-level-'+esc(entry.level)+(seekable?' seekable':'')+'" data-console-level="'+esc(entry.level)+'"'+(seekable?' data-offset="'+off.toFixed(2)+'"':'')+'>';
    h+='<span class="console-level-badge" style="color:'+LOG_COLORS[entry.level]+'">'+LOG_LABELS[entry.level]+'</span>';
    if(seekable){h+='<span class="console-offset">'+off.toFixed(1)+'s</span>';}
    else{h+='<span class="console-time">'+fmtDate(entry.timestamp).split(', ').pop()+'</span>';}
    h+='<span class="console-text">'+esc(stripAnsi(entry.text))+'</span>';
    if(entry.location){var short=entry.location.split('/').pop()||entry.location;h+='<span class="console-loc" title="'+esc(entry.location)+'">'+esc(short)+'</span>';}
    h+='</div>';
    return h;
  }

  var CON_ROW_H=24;
  var CON_VBUF=40;

  function renderConsoleColumn(logs,testType,hasVideo,baseTime){
    if(!logs||logs.length===0)return '';
    var isApi=testType==='api';
    var label=isApi?'Terminal Logs':'Console';

    var counts={};
    for(var i=0;i<logs.length;i++){var l=logs[i].level;counts[l]=(counts[l]||0)+1;}

    var uid='clog-'+Math.random().toString(36).substr(2,6);
    var h='<div class="console-panel" id="'+uid+'">';
    h+='<div class="console-header">';
    h+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>';
    h+=' '+label+' <span class="console-count">'+logs.length+'</span>';
    if(counts.error||counts.stderr){var ec=(counts.error||0)+(counts.stderr||0);h+=' <span class="console-error-count">'+ec+' error'+(ec>1?'s':'')+'</span>';}
    if(counts.warn)h+=' <span class="console-warn-count">'+counts.warn+' warning'+(counts.warn>1?'s':'')+'</span>';
    h+='</div>';

    h+='<div class="console-toolbar">';
    h+='<button class="console-filter-btn active" data-console-filter="all">All</button>';
    var levels=isApi?['stdout','stderr']:['log','info','warn','error','debug'];
    for(var li=0;li<levels.length;li++){
      var lv=levels[li];
      if(counts[lv])h+='<button class="console-filter-btn" data-console-filter="'+lv+'">'+LOG_LABELS[lv]+' <span style="opacity:.6">'+counts[lv]+'</span></button>';
    }
    h+='</div>';

    /* Pre-compute video offsets for all entries */
    var videoOffsets=[];
    if(hasVideo&&baseTime){
      for(var oi=0;oi<logs.length;oi++){videoOffsets.push(consoleVideoOffset(logs[oi],baseTime));}
    }

    /* Use virtualization for large log lists */
    if(logs.length>200){
      h+='<div class="console-list console-vlist" style="overflow-y:auto;max-height:400px;position:relative">';
      h+='<div class="console-vspacer" style="height:'+(logs.length*CON_ROW_H)+'px;position:relative"></div>';
      h+='</div>';
      h+='</div>';

      setTimeout(function(){
        var panel=document.getElementById(uid);if(!panel)return;
        var list=panel.querySelector('.console-vlist');if(!list)return;
        var spacer=list.querySelector('.console-vspacer');
        var allLogs=logs;
        var filteredIdxs=null;
        var highlightIdx=-1;

        function getVis(){return filteredIdxs||allLogs.map(function(_,i){return i});}

        function paint(){
          var vis=getVis();
          spacer.style.height=(vis.length*CON_ROW_H)+'px';
          var st=list.scrollTop;var vh=list.clientHeight;
          var s0=Math.max(0,Math.floor(st/CON_ROW_H)-CON_VBUF);
          var s1=Math.min(vis.length,Math.ceil((st+vh)/CON_ROW_H)+CON_VBUF);
          var out='';
          for(var vi=s0;vi<s1;vi++){
            var ri=vis[vi];var entry=allLogs[ri];
            var off=videoOffsets[ri];
            var seekable=off>=0;
            var isActive=ri===highlightIdx;
            out+='<div class="console-entry console-level-'+esc(entry.level)+(seekable?' seekable':'')+(isActive?' console-active':'')+'" data-console-level="'+esc(entry.level)+'"'+(seekable?' data-offset="'+off.toFixed(2)+'"':'')+' data-vidx="'+ri+'" style="position:absolute;top:'+(vi*CON_ROW_H)+'px;left:0;right:0;height:'+CON_ROW_H+'px">';
            out+='<span class="console-level-badge" style="color:'+LOG_COLORS[entry.level]+'">'+LOG_LABELS[entry.level]+'</span>';
            if(seekable){out+='<span class="console-offset">'+off.toFixed(1)+'s</span>';}
            else{out+='<span class="console-time">'+fmtDate(entry.timestamp).split(', ').pop()+'</span>';}
            out+='<span class="console-text">'+esc(stripAnsi(entry.text))+'</span>';
            if(entry.location){var short=entry.location.split('/').pop()||entry.location;out+='<span class="console-loc" title="'+esc(entry.location)+'">'+esc(short)+'</span>';}
            out+='</div>';
          }
          spacer.innerHTML=out;
        }

        var rafP=false;
        list.addEventListener('scroll',function(){if(!rafP){rafP=true;requestAnimationFrame(function(){rafP=false;paint();})}},{passive:true});

        /* Click-to-seek for virtual entries */
        list.addEventListener('click',function(e){
          var entry=e.target.closest('.console-entry.seekable');
          if(!entry)return;
          var off=parseFloat(entry.getAttribute('data-offset'));
          if(isNaN(off))return;
          var video=document.querySelector('.drawer-body video');
          if(video){video.currentTime=off;video.play();}
        });

        /* Store filter handler */
        panel.__conFilter=function(level){
          if(!level||level==='all'){filteredIdxs=null;}
          else{filteredIdxs=[];for(var i=0;i<allLogs.length;i++){if(allLogs[i].level===level)filteredIdxs.push(i);}}
          list.scrollTop=0;paint();
        };

        /* Video sync: scroll to matching entry by time */
        panel.__videoSync=function(seconds){
          if(!videoOffsets.length)return;
          var vis=getVis();
          var matchVi=-1;
          for(var i=vis.length-1;i>=0;i--){
            if(videoOffsets[vis[i]]>=0&&videoOffsets[vis[i]]<=seconds){matchVi=i;break;}
          }
          if(matchVi<0){highlightIdx=-1;paint();return;}
          var newHL=vis[matchVi];
          if(newHL===highlightIdx)return;
          highlightIdx=newHL;
          /* Scroll to row */
          var rowTop=matchVi*CON_ROW_H;
          var vh=list.clientHeight;
          if(rowTop<list.scrollTop||rowTop>list.scrollTop+vh-CON_ROW_H){
            list.scrollTop=rowTop-vh/2;
          }
          paint();
        };

        paint();
      },0);
    }else{
      h+='<div class="console-list">';
      for(var i=0;i<logs.length;i++){h+=renderConsoleLogEntry(logs[i],hasVideo,baseTime);}
      h+='</div>';
      h+='</div>';

      /* Wire up click-to-seek for non-virtual entries */
      if(hasVideo&&baseTime){
        setTimeout(function(){
          var panel=document.getElementById(uid);if(!panel)return;
          panel.addEventListener('click',function(e){
            var entry=e.target.closest('.console-entry.seekable');
            if(!entry)return;
            var off=parseFloat(entry.getAttribute('data-offset'));
            if(isNaN(off))return;
            var video=document.querySelector('.drawer-body video');
            if(video){video.currentTime=off;video.play();}
          });
          /* Video sync for non-virtual */
          var entries=panel.querySelectorAll('.console-entry.seekable');
          var offsets=[];
          for(var i=0;i<entries.length;i++){
            var off=parseFloat(entries[i].getAttribute('data-offset'));
            if(!isNaN(off))offsets.push({el:entries[i],offset:off});
          }
          if(offsets.length){
            var lastHL=null;
            panel.__videoSync=function(seconds){
              var match=null;
              for(var i=offsets.length-1;i>=0;i--){
                if(offsets[i].offset<=seconds){match=offsets[i].el;break;}
              }
              if(match===lastHL)return;
              if(lastHL)lastHL.classList.remove('console-active');
              if(match){match.classList.add('console-active');match.scrollIntoView({block:'nearest',behavior:'smooth'});}
              lastHL=match;
            };
          }
        },0);
      }
    }
    return h;
  }

  
  /* ── Network Visualization Helpers ── */
  var RES_COLORS={xhr:'#60a5fa',document:'#818cf8',script:'#fbbf24',stylesheet:'#a78bfa',image:'#34d399',font:'#f472b6',other:'#6b7280'};
  var RES_LABELS={xhr:'XHR',document:'Doc',script:'JS',stylesheet:'CSS',image:'Img',font:'Font',other:'Other'};
  var RES_ORDER=['xhr','document','script','stylesheet','image','font','other'];

  function renderResBar(byType,total,mini){
    if(!byType||total===0)return '';
    var h='<div class="net-bar'+(mini?' net-bar--mini':'')+'">';
    for(var i=0;i<RES_ORDER.length;i++){var k=RES_ORDER[i];var cnt=byType[k]||0;if(cnt===0)continue;var pct=(cnt/total*100).toFixed(1);h+='<div class="net-bar-seg" style="width:'+pct+'%;background:'+RES_COLORS[k]+'" title="'+RES_LABELS[k]+': '+cnt+' ('+(cnt/total*100).toFixed(0)+'%)"></div>';}
    h+='</div>';return h;
  }

  function renderResLegend(byType){
    if(!byType)return '';
    var h='<div class="net-bar-legend">';
    for(var i=0;i<RES_ORDER.length;i++){var k=RES_ORDER[i];var cnt=byType[k]||0;if(cnt===0)continue;h+='<span class="net-legend-item"><span class="net-legend-dot" style="background:'+RES_COLORS[k]+'"></span>'+RES_LABELS[k]+' <span class="net-legend-count">'+cnt+'</span></span>';}
    h+='</div>';return h;
  }

  function calcStepTiming(step){
    var t={};
    try{
      if(step.visitedAt&&step.domContentLoadedAt){var dcl=new Date(step.domContentLoadedAt).getTime()-new Date(step.visitedAt).getTime();if(dcl>=0)t.dcl=dcl;}
      if(step.visitedAt&&step.networkIdleAt){var idle=new Date(step.networkIdleAt).getTime()-new Date(step.visitedAt).getTime();if(idle>=0)t.idle=idle;}
    }catch(e){}
    return t;
  }

  function failStatusClass(code){var n=parseInt(code,10);if(n>=400&&n<500)return 'fail-url-badge--4xx';if(n>=500)return 'fail-url-badge--5xx';return 'fail-url-badge--other';}

  function renderFailedUrls(failedUrls){
    if(!failedUrls||failedUrls.length===0)return '';
    var h='<div class="fail-urls">';
    for(var fi=0;fi<failedUrls.length;fi++){
      var furl=failedUrls[fi];var spIdx=furl.indexOf(' ');
      var fStatus=spIdx>0?furl.substring(0,spIdx):'';var fPath=spIdx>0?furl.substring(spIdx+1):furl;
      h+='<div class="fail-url"><span class="fail-url-badge '+failStatusClass(fStatus)+'">'+esc(fStatus)+'</span>'+esc(fPath)+'</div>';
    }
    h+='</div>';return h;
  }

  function renderNetworkPanel(stats){
    if(!stats)return '<div style="padding:7px 12px;font-size:11px;color:var(--fg-2);font-style:italic">No network data</div>';
    var hasFail=stats.failedRequests>0;
    var h='<div class="net-header'+(hasFail?' has-fails':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Network</div>';
    h+='<div class="net-stats-row"><div class="net-stat"><span class="nv">'+stats.totalRequests+'</span><span class="nl">Requests</span></div><div class="net-stat'+(hasFail?' net-fail':'')+'"><span class="nv">'+stats.failedRequests+'</span><span class="nl">Failed</span></div><div class="net-stat"><span class="nv">'+fmtBytes(stats.totalBytes)+'</span><span class="nl">Transfer</span></div></div>';
    if(stats.byType&&stats.totalRequests>0){h+='<div class="net-bar-wrap">'+renderResBar(stats.byType,stats.totalRequests,false)+'</div>';h+=renderResLegend(stats.byType);}
    if(hasFail&&stats.failedRequestUrls&&stats.failedRequestUrls.length>0)h+=renderFailedUrls(stats.failedRequestUrls);
    return h;
  }

  function renderNavTimeline(steps){
    if(!steps||steps.length===0)return '';
    var h='<div class="nav-timeline">';
    for(var i=0;i<steps.length;i++){
      var s=steps[i];var hasNetFail=s.networkStats&&s.networkStats.failedRequests>0;
      h+='<div class="nav-step"><div class="step-connector"><div class="step-node '+(hasNetFail?'node-warn':'node-ok')+'">'+(i+1)+'</div>';
      if(i<steps.length-1)h+='<div class="step-line"></div>';
      h+='</div><div class="step-content"><div class="step-header" data-step="'+i+'"><span class="step-url" title="'+esc(s.url)+'">'+esc(s.url)+'</span><span class="nav-badge nb-'+s.navigationType+'">'+esc(s.navigationType.replace(/_/g,' '))+'</span><span class="step-meta"><span>'+fmtDur(s.duration)+'</span>';
      if(s.networkStats)h+=' <span style="color:var(--fg-2)">'+s.networkStats.totalRequests+' req</span>';
      h+='</span></div><div class="step-detail" id="step-detail-'+i+'">'+renderNetworkPanel(s.networkStats)+'</div></div></div>';
    }
    h+='</div>';return h;
  }

  /* ── Network DevTools Panel ── */
  function ndtStatusClass(code){var n=parseInt(code,10);if(n===0)return 'ndt-status--0';if(n<300)return 'ndt-status--2xx';if(n<400)return 'ndt-status--3xx';if(n<500)return 'ndt-status--4xx';return 'ndt-status--5xx';}
  function urlPath(u){try{var p=new URL(u);return p.pathname+p.search;}catch(e){return u;}}
  function prettyBody(body,ct){
    if(!body)return null;
    if(ct&&(ct.indexOf('json')>=0||ct.indexOf('javascript')>=0)){try{return JSON.stringify(JSON.parse(body),null,2);}catch(e){}}
    return body;
  }

  function renderNdtHeaders(headers,label,emptyMsg){
    if(!headers)return '<div class="ndt-body-empty">'+(emptyMsg||('No '+label+' headers captured'))+'</div>';
    var keys=[];for(var k in headers){if(headers.hasOwnProperty(k))keys.push(k);}
    if(keys.length===0)return '<div class="ndt-body-empty">'+(emptyMsg||('No '+label+' headers captured'))+'</div>';
    keys.sort();
    var h='<table class="ndt-headers-tbl"><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody>';
    for(var i=0;i<keys.length;i++){h+='<tr><td>'+esc(keys[i])+'</td><td>'+esc(headers[keys[i]])+'</td></tr>';}
    h+='</tbody></table>';return h;
  }

  function renderNdtBody(body,truncated,isBinary,ct,emptyLabel){
    if(isBinary)return '<div class="ndt-body-empty">Binary content — not displayed</div>';
    if(!body)return '<div class="ndt-body-empty">'+emptyLabel+'</div>';
    var pretty=prettyBody(body,ct);
    var h='<div class="ndt-body-wrap"><pre class="ndt-body-pre">'+esc(pretty||body)+'</pre>';
    if(truncated)h+='<span class="ndt-body-truncated">Body truncated</span>';
    h+='</div>';return h;
  }

  function renderNdtDetail(req,idx){
    var did='ndt-d-'+idx;
    var h='<div class="ndt-detail" id="'+did+'">';
    h+='<div class="ndt-detail-tabs">';
    h+='<button class="ndt-detail-tab active" data-ndt-tab="general" data-ndt-target="'+did+'">General</button>';
    h+='<button class="ndt-detail-tab" data-ndt-tab="req-headers" data-ndt-target="'+did+'">Request Headers</button>';
    h+='<button class="ndt-detail-tab" data-ndt-tab="req-body" data-ndt-target="'+did+'">Payload</button>';
    h+='<button class="ndt-detail-tab" data-ndt-tab="res-headers" data-ndt-target="'+did+'">Response Headers</button>';
    h+='<button class="ndt-detail-tab" data-ndt-tab="res-body" data-ndt-target="'+did+'">Response</button>';
    h+='</div>';

    /* General tab */
    h+='<div class="ndt-detail-pane active" data-ndt-pane="general">';
    h+='<div class="ndt-general">';
    h+='<span class="ndt-general-k">Request URL</span><span class="ndt-general-v">'+esc(req.url)+'</span>';
    h+='<span class="ndt-general-k">Method</span><span class="ndt-general-v">'+esc(req.method)+'</span>';
    h+='<span class="ndt-general-k">Status Code</span><span class="ndt-general-v'+(req.statusCode>=400||req.statusCode===0?' ndt-err':'')+'">'+req.statusCode+(req.error?' ('+esc(req.error)+')':'')+'</span>';
    h+='<span class="ndt-general-k">Resource Type</span><span class="ndt-general-v">'+esc(req.resourceType)+'</span>';
    if(req.contentType)h+='<span class="ndt-general-k">Content-Type</span><span class="ndt-general-v">'+esc(req.contentType)+'</span>';
    h+='<span class="ndt-general-k">Response Size</span><span class="ndt-general-v">'+fmtBytes(req.responseSize||0)+'</span>';
    h+='<span class="ndt-general-k">Response Time</span><span class="ndt-general-v">'+fmtDur(req.responseTimeMs)+'</span>';
    if(req.startedAt)h+='<span class="ndt-general-k">Started At</span><span class="ndt-general-v">'+fmtDate(req.startedAt)+'</span>';
    if(req.error)h+='<span class="ndt-general-k">Error</span><span class="ndt-general-v ndt-err">'+esc(req.error)+'</span>';
    h+='</div></div>';

    /* Request Headers tab */
    h+='<div class="ndt-detail-pane" data-ndt-pane="req-headers">'+renderNdtHeaders(req.requestHeaders,'request')+'</div>';

    /* Payload tab (request body) */
    h+='<div class="ndt-detail-pane" data-ndt-pane="req-body">'+renderNdtBody(req.requestBody,req.requestBodyTruncated,false,req.contentType,'No request body')+'</div>';

    /* Response Headers tab */
    h+='<div class="ndt-detail-pane" data-ndt-pane="res-headers">'+renderNdtHeaders(req.responseHeaders,'response')+'</div>';

    /* Response tab */
    h+='<div class="ndt-detail-pane" data-ndt-pane="res-body">'+renderNdtBody(req.responseBody,req.responseBodyTruncated,req.isBinary,req.contentType,'No response body captured')+'</div>';

    h+='</div>';return h;
  }

  var NDT_ROW_H=32;
  var NDT_DETAIL_H=280;
  var NDT_VBUF=30;

  function ndtVideoOffset(req,baseTime){
    if(!baseTime||!req.startedAt)return -1;
    var t=Date.parse(req.startedAt);
    if(isNaN(t))return -1;
    var off=(t-baseTime)/1000;
    return off>=0?off:-1;
  }

  function renderNetworkDevTools(reqs,hasVideo,baseTime,pageMeta){
    if(!reqs||reqs.length===0)return '<div class="artifact-empty">No network requests captured</div>';
    var uid='ndt-'+Math.random().toString(36).substr(2,6);
    var h='<div class="ndt" id="'+uid+'">';

    /* Toolbar with type filters and search */
    h+='<div class="ndt-toolbar">';
    h+='<div class="ndt-filter">';
    h+='<button class="ndt-filter-btn active" data-ndt-filter="all">All</button>';
    var types=['xhr','document','script','stylesheet','image','font','other'];
    var typeLabels={xhr:'XHR',document:'Doc',script:'JS',stylesheet:'CSS',image:'Img',font:'Font',other:'Other'};
    for(var ti=0;ti<types.length;ti++){
      var cnt=0;for(var ci=0;ci<reqs.length;ci++){if(reqs[ci].resourceType===types[ti])cnt++;}
      if(cnt>0)h+='<button class="ndt-filter-btn" data-ndt-filter="'+types[ti]+'">'+typeLabels[types[ti]]+' <span style="opacity:.6">'+cnt+'</span></button>';
    }
    h+='</div>';
    h+='<input class="ndt-search" placeholder="Filter URLs..." data-ndt-search="'+uid+'">';
    h+='<span class="ndt-count" data-ndt-count="'+uid+'">'+reqs.length+' requests</span>';
    h+='</div>';

    /* Virtualized request list */
    h+='<div class="ndt-list ndt-vlist" data-ndt-list="'+uid+'" data-ndt-uid="'+uid+'" style="overflow-y:auto;max-height:400px;position:relative">';
    h+='<div class="ndt-vspacer" style="height:'+(reqs.length*NDT_ROW_H)+'px;position:relative"></div>';
    h+='</div></div>';

    /* Pre-compute video offsets */
    var ndtVideoOffsets=[];
    if(hasVideo&&baseTime){
      for(var noi=0;noi<reqs.length;noi++){ndtVideoOffsets.push(ndtVideoOffset(reqs[noi],baseTime));}
    }

    /* Store reqs data for virtual rendering */
    setTimeout(function(){
      var el=document.getElementById(uid);if(!el)return;
      var list=el.querySelector('.ndt-vlist');if(!list)return;
      var spacer=list.querySelector('.ndt-vspacer');
      var allReqs=reqs;
      var filteredIdxs=null;
      var openIdx=-1;
      var openTab='general';
      var highlightIdx=-1;

      function getVisible(){return filteredIdxs||allReqs.map(function(_,i){return i});}

      var lastDetailH=NDT_DETAIL_H;
      var NDT_TABS=['general','req-headers','req-body','res-headers','res-body'];

      function renderDetailWithTab(r,ri,activeTab){
        var html=renderNdtDetail(r,ri);
        /* Replace the default active tab/pane with the tracked one */
        if(activeTab&&activeTab!=='general'){
          /* Remove default active from general tab button and pane */
          html=html.replace('data-ndt-tab="general" data-ndt-target','data-ndt-tab="general" data-ndt-target');
          /* Swap active classes: remove from general, add to activeTab */
          var parts=html;
          /* Tabs: remove active from all, add to target */
          for(var t=0;t<NDT_TABS.length;t++){
            var tn=NDT_TABS[t];
            var isAct=tn===activeTab;
            parts=parts.replace(new RegExp('class="ndt-detail-tab'+(tn==='general'?' active':'')+'" data-ndt-tab="'+tn+'"'),'class="ndt-detail-tab'+(isAct?' active':'')+'" data-ndt-tab="'+tn+'"');
          }
          /* Panes: remove active from all, add to target */
          for(var p=0;p<NDT_TABS.length;p++){
            var pn=NDT_TABS[p];
            var isPAct=pn===activeTab;
            parts=parts.replace(new RegExp('class="ndt-detail-pane'+(pn==='general'?' active':'')+'" data-ndt-pane="'+pn+'"'),'class="ndt-detail-pane'+(isPAct?' active':'')+'" data-ndt-pane="'+pn+'"');
          }
          html=parts;
        }
        return html.replace('class="ndt-detail"','class="ndt-detail show"');
      }

      function paint(){
        var vis=getVisible();
        /* Find the visual index of the open row (if any) */
        var openVi=-1;
        if(openIdx>=0){for(var oi=0;oi<vis.length;oi++){if(vis[oi]===openIdx){openVi=oi;break;}}}
        var detailExtra=openVi>=0?lastDetailH:0;
        var totalH=vis.length*NDT_ROW_H+detailExtra;
        spacer.style.height=totalH+'px';
        var st=list.scrollTop;var vh=list.clientHeight;
        var startRow=Math.max(0,Math.floor(st/NDT_ROW_H)-NDT_VBUF);
        var endRow=Math.min(vis.length,Math.ceil((st+vh+detailExtra)/NDT_ROW_H)+NDT_VBUF);
        var out='';
        for(var vi=startRow;vi<endRow;vi++){
          var ri=vis[vi];var r=allReqs[ri];
          var isFail=r.statusCode>=400||r.statusCode===0;
          var isOpen=ri===openIdx;
          var isActive=ri===highlightIdx;
          var off=ndtVideoOffsets[ri];
          var seekable=off>=0;
          /* Rows after the open row shift down by the detail panel height */
          var rowTop=vi*NDT_ROW_H+(openVi>=0&&vi>openVi?lastDetailH:0);
          out+='<div class="ndt-row'+(isFail?' ndt-row--fail':'')+(isOpen?' ndt-row--open':'')+(seekable?' seekable':'')+(isActive?' ndt-row--active':'')+'" data-ndt-idx="'+ri+'" data-ndt-type="'+esc(r.resourceType)+'" data-ndt-url="'+esc(r.url.toLowerCase())+'"'+(seekable?' data-offset="'+off.toFixed(2)+'"':'')+' style="position:absolute;top:'+rowTop+'px;left:0;right:0;height:'+NDT_ROW_H+'px">';
          out+='<span class="ndt-status '+ndtStatusClass(r.statusCode)+'">'+r.statusCode+'</span>';
          out+='<span class="ndt-method">'+esc(r.method)+'</span>';
          out+='<span class="ndt-url" title="'+esc(r.url)+'">'+esc(urlPath(r.url))+'</span>';
          out+='<span class="ndt-type">'+esc(RES_LABELS[r.resourceType]||r.resourceType)+'</span>';
          out+='<span class="ndt-size">'+fmtBytes(r.responseSize||0)+'</span>';
          if(seekable){out+='<span class="ndt-time ndt-offset">'+off.toFixed(1)+'s</span>';}
          else{out+='<span class="ndt-time">'+fmtDur(r.responseTimeMs)+'</span>';}
          out+='</div>';
          if(isOpen){out+='<div style="position:absolute;top:'+(rowTop+NDT_ROW_H)+'px;left:0;right:0;z-index:1" class="ndt-detail-wrap">'+renderDetailWithTab(r,ri,openTab)+'</div>';}
        }
        spacer.innerHTML=out;
        /* Measure actual detail height and adjust layout without full repaint */
        if(openVi>=0){
          var detailWrap=spacer.querySelector('.ndt-detail-wrap');
          if(detailWrap){
            var measuredH=detailWrap.offsetHeight;
            if(measuredH>0&&Math.abs(measuredH-lastDetailH)>2){
              lastDetailH=measuredH;
              /* Update spacer height and row positions without re-rendering */
              var newTotalH=vis.length*NDT_ROW_H+lastDetailH;
              spacer.style.height=newTotalH+'px';
              var rows=spacer.querySelectorAll('.ndt-row');
              for(var rr=0;rr<rows.length;rr++){
                var rrIdx=parseInt(rows[rr].getAttribute('data-ndt-idx'),10);
                /* Find visual index for this row */
                for(var rv=startRow;rv<endRow;rv++){if(vis[rv]===rrIdx){
                  if(rv>openVi){rows[rr].style.top=(rv*NDT_ROW_H+lastDetailH)+'px';}
                  break;
                }}
              }
              detailWrap.style.top=((openVi*NDT_ROW_H)+NDT_ROW_H)+'px';
            }
          }
        }
        var countEl=el.querySelector('.ndt-count');
        if(countEl)countEl.textContent=vis.length+(vis.length!==allReqs.length?' / '+allReqs.length:'')+' requests';
      }

      var rafPending=false;
      /* Infinite scroll: pagination state */
      var _pgTestId=pageMeta&&pageMeta.testId?pageMeta.testId:null;
      var _pgPage=pageMeta&&pageMeta.page?pageMeta.page:1;
      var _pgTotal=pageMeta&&pageMeta.total?pageMeta.total:allReqs.length;
      var _pgPageSize=pageMeta&&pageMeta.pageSize?pageMeta.pageSize:500;
      var _pgLoading=false;

      function updateFilterBtns(){
        var filterDiv=el.querySelector('.ndt-filter');if(!filterDiv)return;
        var activeFilter='all';
        var activeBtn=filterDiv.querySelector('.ndt-filter-btn.active');
        if(activeBtn)activeFilter=activeBtn.getAttribute('data-ndt-filter')||'all';
        var btnH='<button class="ndt-filter-btn'+(activeFilter==='all'?' active':'')+'" data-ndt-filter="all">All</button>';
        var types=['xhr','document','script','stylesheet','image','font','other'];
        var typeLabels={xhr:'XHR',document:'Doc',script:'JS',stylesheet:'CSS',image:'Img',font:'Font',other:'Other'};
        for(var ti=0;ti<types.length;ti++){
          var cnt=0;for(var ci=0;ci<allReqs.length;ci++){if(allReqs[ci].resourceType===types[ti])cnt++;}
          if(cnt>0)btnH+='<button class="ndt-filter-btn'+(activeFilter===types[ti]?' active':'')+'" data-ndt-filter="'+types[ti]+'">'+typeLabels[types[ti]]+' <span style="opacity:.6">'+cnt+'</span></button>';
        }
        filterDiv.innerHTML=btnH;
      }

      function loadNextPage(){
        if(_pgLoading||!_pgTestId)return;
        if(allReqs.length>=_pgTotal)return;
        _pgLoading=true;
        var fetchData=window.__trFetchTestData;
        if(!fetchData){_pgLoading=false;return;}
        fetchData(_pgTestId,'network',_pgPage+1,_pgPageSize,function(err,result){
          _pgLoading=false;
          if(err||!result||!result.items)return;
          _pgPage++;
          for(var i=0;i<result.items.length;i++){
            allReqs.push(result.items[i]);
            if(hasVideo&&baseTime){ndtVideoOffsets.push(ndtVideoOffset(result.items[i],baseTime));}
          }
          _pgTotal=result.total;
          /* Re-apply filter to include new items */
          if(filteredIdxs!==null){
            var filterDiv=el.querySelector('.ndt-filter');
            var activeBtn=filterDiv?filterDiv.querySelector('.ndt-filter-btn.active'):null;
            var ft=activeBtn?activeBtn.getAttribute('data-ndt-filter'):'all';
            var searchEl=el.querySelector('.ndt-search');
            var q=searchEl?searchEl.value.toLowerCase():'';
            if(ft&&ft!=='all'||q){
              filteredIdxs=[];
              for(var fi=0;fi<allReqs.length;fi++){
                var r=allReqs[fi];
                if(ft&&ft!=='all'&&r.resourceType!==ft)continue;
                if(q&&r.url.toLowerCase().indexOf(q)<0)continue;
                filteredIdxs.push(fi);
              }
            }else{filteredIdxs=null;}
          }
          updateFilterBtns();
          paint();
        });
      }

      list.addEventListener('scroll',function(){
        if(!rafPending){rafPending=true;requestAnimationFrame(function(){rafPending=false;paint();});}
        /* Infinite scroll: load more when near bottom */
        if(list.scrollTop+list.clientHeight>=list.scrollHeight-200){loadNextPage();}
      },{passive:true});

      /* Click handler for rows */
      list.addEventListener('click',function(e){
        var tab=e.target.closest('.ndt-detail-tab');
        if(tab){
          /* Handle tab switch within detail panel — DOM-only, no repaint */
          e.stopPropagation();
          var tgt=tab.getAttribute('data-ndt-target');
          var pane=tab.getAttribute('data-ndt-tab');
          openTab=pane;
          var det=document.getElementById(tgt);
          if(det){
            var tabs=det.querySelectorAll('.ndt-detail-tab');
            for(var ti=0;ti<tabs.length;ti++)tabs[ti].classList.remove('active');
            tab.classList.add('active');
            var panes=det.querySelectorAll('.ndt-detail-pane');
            for(var pi=0;pi<panes.length;pi++)panes[pi].classList.remove('active');
            var tp=det.querySelector('[data-ndt-pane="'+pane+'"]');
            if(tp)tp.classList.add('active');
            /* Re-measure after tab switch since pane height may differ */
            requestAnimationFrame(function(){
              var detailWrap=spacer.querySelector('.ndt-detail-wrap');
              if(detailWrap){
                var mh=detailWrap.offsetHeight;
                if(mh>0&&Math.abs(mh-lastDetailH)>2){
                  lastDetailH=mh;
                  /* Adjust layout without full repaint to preserve tab state */
                  var vis=getVisible();
                  var ovi=-1;
                  for(var oi=0;oi<vis.length;oi++){if(vis[oi]===openIdx){ovi=oi;break;}}
                  spacer.style.height=(vis.length*NDT_ROW_H+lastDetailH)+'px';
                  var rows=spacer.querySelectorAll('.ndt-row');
                  for(var rr=0;rr<rows.length;rr++){
                    var rrIdx=parseInt(rows[rr].getAttribute('data-ndt-idx'),10);
                    for(var rv=0;rv<vis.length;rv++){if(vis[rv]===rrIdx){
                      if(rv>ovi){rows[rr].style.top=(rv*NDT_ROW_H+lastDetailH)+'px';}
                      break;
                    }}
                  }
                }
              }
            });
          }
          return;
        }
        var row=e.target.closest('.ndt-row');if(!row)return;
        e.stopPropagation();
        var idx=parseInt(row.getAttribute('data-ndt-idx'),10);
        openIdx=openIdx===idx?-1:idx;
        openTab='general';
        lastDetailH=NDT_DETAIL_H;
        paint();
      });

      /* Store filter/search handler on element */
      el.__ndtFilter=function(filterType,searchVal){
        var q=(searchVal||'').toLowerCase();
        if((!filterType||filterType==='all')&&!q){filteredIdxs=null;}
        else{
          filteredIdxs=[];
          for(var i=0;i<allReqs.length;i++){
            var r=allReqs[i];
            if(filterType&&filterType!=='all'&&r.resourceType!==filterType)continue;
            if(q&&r.url.toLowerCase().indexOf(q)<0)continue;
            filteredIdxs.push(i);
          }
        }
        openIdx=-1;
        list.scrollTop=0;
        paint();
      };

      /* Video sync: scroll to matching request by time */
      if(ndtVideoOffsets.length){
        el.__videoSync=function(seconds){
          var vis=getVisible();
          var matchVi=-1;
          for(var i=vis.length-1;i>=0;i--){
            if(ndtVideoOffsets[vis[i]]>=0&&ndtVideoOffsets[vis[i]]<=seconds){matchVi=i;break;}
          }
          if(matchVi<0){highlightIdx=-1;paint();return;}
          var newHL=vis[matchVi];
          if(newHL===highlightIdx)return;
          highlightIdx=newHL;
          var syncOpenVi=-1;
          if(openIdx>=0){var svis=getVisible();for(var si=0;si<svis.length;si++){if(svis[si]===openIdx){syncOpenVi=si;break;}}}
          var rowTop=matchVi*NDT_ROW_H+(syncOpenVi>=0&&matchVi>syncOpenVi?lastDetailH:0);
          var vh=list.clientHeight;
          if(rowTop<list.scrollTop||rowTop>list.scrollTop+vh-NDT_ROW_H){
            list.scrollTop=rowTop-vh/2;
          }
          paint();
        };
      }

      paint();
    },0);
    return h;
  }

  function renderTimelineColumn(steps,networkRequests,consoleLogs,testType,hasVideo,baseTime,pageMeta){
    if(!steps||steps.length===0)return '<div class="artifact-empty">No navigation data</div>';
    var hasReqs=networkRequests&&networkRequests.length>0;
    var hasCLogs=consoleLogs&&consoleLogs.length>0;

  function renderFailure(failure,filePath,testName,tags){
    if(!failure)return '';
    var sid='s-'+Math.random().toString(36).substr(2,8);
    var cpid='cp-'+Math.random().toString(36).substr(2,8);
    var h='<div class="failure-panel"><div class="failure-panel-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Failure Details<button class="copy-prompt-btn" id="'+cpid+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy Prompt</button></div>';
    h+='<div class="failure-message">'+esc(stripAnsi(failure.message))+'</div>';
    if(failure.code)h+=renderCodeSnippet(failure.code);
    if(failure.line!==null&&failure.line!==undefined)h+='<div class="line-marker">Line '+failure.line+'</div>';
    if(failure.stack){h+='<button class="stack-toggle-btn" data-stack="'+sid+'">Show stack trace</button><div class="stack-trace" id="'+sid+'">'+esc(stripAnsi(failure.stack))+'</div>';}
    h+='</div>';
    /* Wire up Copy Prompt button after render */
    setTimeout(function(){
      var btn=document.getElementById(cpid);
      if(!btn)return;
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var nl=String.fromCharCode(10);
        var ticks=String.fromCharCode(96,96,96);
        var msg=failure.message?stripAnsi(failure.message):'Unknown error';
        var tname=testName||'Unknown test';
        var tline=(failure.line!==null&&failure.line!==undefined)?String(failure.line):'unknown';
        var ttags=(tags&&tags.length>0)?tags.join(', '):'none';
        var fp=filePath||'unknown';
        /* Escape regex special chars in test name for --grep */
        function escGrep(s){return s.replace(/[.*+?^]/g,'\\$&').replace(/[()]/g,'\\$&');}
        var tnameEsc=escGrep(tname);
        var p='You are a Playwright test repair agent. A test in this codebase has failed. Your job is to fix the code and verify the fix passes.'+nl+nl;
        p+='## Failed Test'+nl+nl;
        p+='- **File:** '+fp+nl;
        p+='- **Test Name:** '+tname+nl;
        p+='- **Line:** '+tline+nl;
        p+='- **Tags:** '+ttags+nl+nl;
        p+='## Error'+nl+nl;
        p+=msg+nl+nl;
        if(failure.code){
          p+='## Failing Code'+nl+nl;
          p+=ticks+'typescript'+nl+stripAnsi(failure.code)+nl+ticks+nl+nl;
        }
        if(failure.stack){
          p+='## Stack Trace'+nl+nl;
          p+=ticks+nl+stripAnsi(failure.stack)+nl+ticks+nl+nl;
        }
        p+='## Your Task'+nl+nl;
        p+='1. Analyze the error and identify the root cause'+nl;
        p+='2. Edit '+ticks+fp+ticks+' to fix the failing assertion or logic '+String.fromCharCode(8212)+' do not delete the test'+nl;
        p+='3. Run the specific test to verify the fix: '+ticks+'npx playwright test '+fp+' --grep "'+tnameEsc+'" --reporter=line'+ticks+nl;
        p+='4. If the test passes, run the full file to confirm no regressions: '+ticks+'npx playwright test '+fp+' --reporter=line'+ticks+nl;
        p+='5. Stop only when the test exits with status '+ticks+'passed'+ticks+nl+nl;
        p+='## Constraints'+nl+nl;
        p+='- Only modify '+ticks+fp+ticks+nl;
        p+='- Do not alter shared fixtures, helpers, or '+ticks+'playwright.config.ts'+ticks+nl;
        p+='- Do not skip or remove the test'+nl;
        navigator.clipboard.writeText(p).then(function(){
          btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Copied!';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy Prompt';btn.classList.remove('copied');},2000);
        });
      });
    },0);
    return h;
  }

  function ndtApplyFilters(ndt,filterType,searchVal){

      var searchInput=ndt.querySelector('.ndt-search');
      var q=(searchVal!==null&&searchVal!==undefined)?searchVal:(searchInput?searchInput.value:'');
      ndt.__ndtFilter(filterType,q);
      return;

    /* Fallback for non-virtual lists (API calls panel) */
    var list=ndt.querySelector('.ndt-list');if(!list)return;
    var searchInput=ndt.querySelector('.ndt-search');
    var q=(searchVal!==null&&searchVal!==undefined)?searchVal:(searchInput?searchInput.value:'');
    q=q.toLowerCase();
    var rows=list.querySelectorAll('.ndt-row');
    var visible=0;
    for(var i=0;i<rows.length;i++){
      var row=rows[i];
      var type=row.getAttribute('data-ndt-type');
      var url=row.getAttribute('data-ndt-url')||'';
      var show=true;
      if(filterType&&filterType!=='all'&&type!==filterType)show=false;
      if(show&&q&&url.indexOf(q)<0)show=false;
      row.style.display=show?'':'none';
      var det=row.nextElementSibling;
      if(det&&det.classList.contains('ndt-detail')){if(!show){det.classList.remove('show');row.classList.remove('ndt-row--open');}}
      if(show)visible++;
    }
    var countEl=ndt.querySelector('.ndt-count');
    if(countEl)countEl.textContent=visible+' / '+rows.length+' requests';
  }

  
var _filterState={status:{},type:{},specFile:{}};

function renderFilterBar(){

    h+='<button class="'+cls+'" data-dimension="status" data-value="'+s+'">'+statusLabels[s]+' <span class="chip-count">'+cnt+'</span></button>';

  if(hasAdvanced)h+='<span class="filter-icon-badge"></span>';

    d+='<div class="filter-drawer-section"><span class="filter-drawer-section-label">Type</span>';

      d+='<button class="'+cls+'" data-dimension="type" data-value="'+esc(tp)+'">'+esc(tp)+' <span class="chip-count">'+cnt+'</span></button>';
    }

  var specs=Object.keys(specCounts).sort();
  if(specs.length>1){

    d+='<div class="filter-chips">';

function initFilters(){
  _filterState={status:{},type:{},specFile:{}};
  _totalTests=tests.length;
  _originalSummary={total:data.summary.total,passed:data.summary.passed,
    failed:data.summary.failed,flaky:data.summary.flaky,
    skipped:data.summary.skipped,timedout:data.summary.timedout||0};
}

function getFilteredTests(){
  var hasStatus=Object.keys(_filterState.status).length>0;
  var hasType=Object.keys(_filterState.type).length>0;
  var hasSpec=Object.keys(_filterState.specFile).length>0;
  var out=[];
  for(var i=0;i<tests.length;i++){
    var t=tests[i];
    if(hasStatus&&!_filterState.status[t.status])continue;
    if(hasType&&!_filterState.type[t.testType||'unknown'])continue;
    if(hasSpec&&!_filterState.specFile[t.filePath])continue;
    if(searchQuery){
      var q=searchQuery.toLowerCase();
      var match=t.title.toLowerCase().indexOf(q)>=0||t.filePath.toLowerCase().indexOf(q)>=0||(t.suiteName&&t.suiteName.toLowerCase().indexOf(q)>=0);
      if(!match&&t.tags){for(var ti=0;ti<t.tags.length;ti++){if(t.tags[ti]&&t.tags[ti].toLowerCase().indexOf(q)>=0){match=true;break}}}
      if(!match)continue;
    }
    out.push(t);
  }
  return out;
}

function toggleFilter(dim,val){
  if(!_filterState[dim])_filterState[dim]={};
  if(_filterState[dim][val]){
    delete _filterState[dim][val];
  }else{
    _filterState[dim][val]=true;
  }
  applyFilters();
}

function clearAllFilters(){
  _filterState={status:{},type:{},specFile:{}};
  searchQuery='';
  var si=document.getElementById('search-input');
  if(si)si.value='';
  applyFilters();
}

function applyFilters(){
  renderFilterBar();
  renderTestGrid();
  var hasStatus=Object.keys(_filterState.status).length>0;
  var hasType=Object.keys(_filterState.type).length>0;
  var hasSpec=Object.keys(_filterState.specFile).length>0;
  var hasAny=hasStatus||hasType||hasSpec||!!searchQuery;
  if(hasAny){
    var filtered=getFilteredTests();
    var byStatus={passed:0,failed:0,flaky:0,skipped:0,timedout:0};
    for(var i=0;i<filtered.length;i++){
      var st=filtered[i].status;
      if(byStatus[st]!==undefined)byStatus[st]++;
    }
    _updateCard('s-total',filtered.length);
    _updateCard('s-passed',byStatus.passed);
    _updateCard('s-failed',byStatus.failed);
    _updateCard('s-flaky',byStatus.flaky);
    _updateCard('s-skipped',byStatus.skipped);
    _updateCard('s-timedout',byStatus.timedout);
    var shown=document.getElementById('filter-shown');
    if(shown)shown.textContent=''+filtered.length;
  }else if(_originalSummary){
    _updateCard('s-total',_originalSummary.total);
    _updateCard('s-passed',_originalSummary.passed);
    _updateCard('s-failed',_originalSummary.failed);
    _updateCard('s-flaky',_originalSummary.flaky);
    _updateCard('s-skipped',_originalSummary.skipped);
    _updateCard('s-timedout',_originalSummary.timedout);
  }
}

function _updateCard(cls,val){
  var el=document.querySelector('.'+cls+' .s-count');
  if(el)el.textContent=''+val;
}

  
  /* ── Artifact Utilities ── */
  function formatBytes(bytes){
    if(bytes===0)return '0 B';
    var k=1024;var sizes=['B','KB','MB','GB'];
    var i=Math.floor(Math.log(bytes)/Math.log(k));
    if(i>=sizes.length)i=sizes.length-1;
    return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];
  }

  
  /* ── Event Delegation ── */
  document.addEventListener('click',function(e){
    var target=e.target;

    /* Test row click → open drawer */
    var row=target.closest('.test-row');
    if(row){openDrawer(row.getAttribute('data-testid'));return;}

    /* Filter chip (multi-dimensional) */
    var chip=target.closest('.filter-chip');
    if(chip){
      var dim=chip.getAttribute('data-dimension');
      var val=chip.getAttribute('data-value');
      if(dim&&val)toggleFilter(dim,val);
      return;
    }

    /* Clear all filters */
    if(target.closest('.filter-clear')){clearAllFilters();return;}

    /* Filter icon → open filter drawer */
    if(target.closest('.filter-icon-btn')){openFilterDrawer();return;}

    /* Filter drawer close */
    if(target.closest('#filter-drawer-close')){closeFilterDrawer();return;}
    if(target.closest('#filter-drawer-backdrop')){closeFilterDrawer();return;}

    /* Step header → expand/collapse */
    var stepH=target.closest('[data-step]');
    if(stepH){var sd=document.getElementById('step-detail-'+stepH.getAttribute('data-step'));if(sd)sd.classList.toggle('show');return;}

    /* Screenshot → lightbox */
    if(target.classList.contains('artifact-thumb')||target.classList.contains('artifact-col-img')){openLightbox(target.src);return;}

    /* Segmented control switch */
    var segBtn=target.closest('.seg-btn');
    if(segBtn){
      var group=segBtn.parentElement;
      if(group&&group.classList.contains('seg-ctrl')){
        var col=group.parentElement;
        var btns=group.querySelectorAll('.seg-btn');
        for(var bi=0;bi<btns.length;bi++)btns[bi].classList.remove('active');
        segBtn.classList.add('active');
        var panes=col.querySelectorAll('.seg-pane');
        for(var pi=0;pi<panes.length;pi++){panes[pi].classList.remove('active');var vid=panes[pi].querySelector('video');if(vid)vid.pause();}
        var tp=col.querySelector('[data-seg-pane="'+segBtn.getAttribute('data-seg')+'"]');
        if(tp)tp.classList.add('active');
      }
      return;
    }

    /* Network DevTools: request row → expand/collapse detail */
    var ndtRow=target.closest('.ndt-row');
    if(ndtRow){
      /* Virtual lists handle their own click events */
      var vlist=ndtRow.closest('.ndt-vlist');
      if(vlist)return;
      var idx=ndtRow.getAttribute('data-ndt-idx');
      var det=document.getElementById('ndt-d-'+idx);
      if(det){
        var isOpen=det.classList.toggle('show');
        ndtRow.classList.toggle('ndt-row--open',isOpen);
        /* Close other open details */
        var list=ndtRow.parentElement;
        if(list){var others=list.querySelectorAll('.ndt-detail.show');for(var oi=0;oi<others.length;oi++){if(others[oi]!==det){others[oi].classList.remove('show');var pr=others[oi].previousElementSibling;if(pr)pr.classList.remove('ndt-row--open');}}}
      }
      return;
    }

    /* Network DevTools: detail tab switch */
    var ndtTab=target.closest('.ndt-detail-tab');
    if(ndtTab){
      var tgt=ndtTab.getAttribute('data-ndt-target');
      var pane=ndtTab.getAttribute('data-ndt-tab');
      var det=document.getElementById(tgt);
      if(det){
        var tabs=det.querySelectorAll('.ndt-detail-tab');
        for(var ti=0;ti<tabs.length;ti++)tabs[ti].classList.remove('active');
        ndtTab.classList.add('active');
        var panes=det.querySelectorAll('.ndt-detail-pane');
        for(var pi=0;pi<panes.length;pi++)panes[pi].classList.remove('active');
        var tp=det.querySelector('[data-ndt-pane="'+pane+'"]');
        if(tp)tp.classList.add('active');
      }
      return;
    }

    /* Network DevTools: type filter */
    var ndtFilterBtn=target.closest('.ndt-filter-btn');
    if(ndtFilterBtn){
      var filterType=ndtFilterBtn.getAttribute('data-ndt-filter');
      var toolbar=ndtFilterBtn.closest('.ndt-toolbar');
      if(toolbar){
        var btns=toolbar.querySelectorAll('.ndt-filter-btn');
        for(var bi=0;bi<btns.length;bi++)btns[bi].classList.remove('active');
        ndtFilterBtn.classList.add('active');
        var ndt=toolbar.closest('.ndt');
        if(ndt){ndtApplyFilters(ndt,filterType,null);}
      }
      return;
    }

    /* Console log level filter */
    var consoleFilterBtn=target.closest('.console-filter-btn');
    if(consoleFilterBtn){
      var toolbar=consoleFilterBtn.closest('.console-toolbar');
      if(toolbar){
        var btns=toolbar.querySelectorAll('.console-filter-btn');
        for(var bi=0;bi<btns.length;bi++)btns[bi].classList.remove('active');
        consoleFilterBtn.classList.add('active');
        var filterLevel=consoleFilterBtn.getAttribute('data-console-filter');
        var panel=consoleFilterBtn.closest('.console-panel');
        /* Use virtual filter if available */
        if(panel&&panel.__conFilter){panel.__conFilter(filterLevel);return;}
        var list=panel?panel.querySelector('.console-list'):null;
        if(list){
          var entries=list.querySelectorAll('.console-entry');
          for(var ei=0;ei<entries.length;ei++){
            if(filterLevel==='all'){entries[ei].style.display='';}
            else{entries[ei].style.display=entries[ei].getAttribute('data-console-level')===filterLevel?'':'none';}
          }
        }
      }
      return;
    }

    /* Action step click → seek video + highlight */
    var actionStep=target.closest('.action-step.seekable');
    if(actionStep){
      var offset=parseFloat(actionStep.getAttribute('data-offset'));
      if(!isNaN(offset)){
        var video=document.querySelector('.drawer-body video');
        if(video){video.currentTime=offset;video.play();}
        /* Clear previous active and highlight clicked */
        var prev=document.querySelectorAll('.action-active');
        for(var ai=0;ai<prev.length;ai++)prev[ai].classList.remove('action-active');
        actionStep.classList.add('action-active');
        actionStep.classList.add('seeking');
        setTimeout(function(){actionStep.classList.remove('seeking');},400);
      }
      return;
    }

    /* Stack trace toggle */
    if(target.classList.contains('stack-toggle-btn')){var se=document.getElementById(target.getAttribute('data-stack'));if(se){var sv=se.classList.toggle('show');target.textContent=sv?'Hide stack trace':'Show stack trace';}return;}

    /* Lightbox close */
    if(target.classList.contains('lightbox-overlay')||target.classList.contains('lightbox-close')){closeLightbox();return;}

    /* Theme toggle */
    var themeBtn=target.closest('.theme-btn');
    if(themeBtn){setTheme(themeBtn.getAttribute('data-theme-val'));return;}

    /* Drawer close */
    if(target.closest('#drawer-close')){closeDrawer();return;}
    if(target.closest('#drawer-backdrop')){closeDrawer();return;}
  });

  /* Search input — main test search + network filter search */
  document.addEventListener('input',function(e){
    if(e.target.id==='search-input')doSearch(e.target.value);
    if(e.target.hasAttribute('data-ndt-search')){
      var ndt=e.target.closest('.ndt');
      if(ndt){
        var activeBtn=ndt.querySelector('.ndt-filter-btn.active');
        var filterType=activeBtn?activeBtn.getAttribute('data-ndt-filter'):'all';
        ndtApplyFilters(ndt,filterType,e.target.value);
      }
    }
  });

  /* Keyboard */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeLightbox();closeDrawer();closeFilterDrawer();}
  });

  /* ── Theme Management ── */
  function getThemePref(){return localStorage.getItem('tr-theme')||'system'}
  function resolveTheme(pref){return pref==='system'?(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):pref}
  function applyTheme(){
    var pref=getThemePref();
    document.documentElement.setAttribute('data-theme',resolveTheme(pref));
    var btns=document.querySelectorAll('.theme-btn');
    for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].getAttribute('data-theme-val')===pref);}
  }
  function setTheme(pref){localStorage.setItem('tr-theme',pref);applyTheme();}
  try{window.matchMedia('(prefers-color-scheme:light)').addEventListener('change',function(){if(getThemePref()==='system')applyTheme();});}catch(e){}

  /* ── Lightbox ── */
  function openLightbox(src){
    var o=document.createElement('div');o.className='lightbox-overlay';
    o.innerHTML='<img src="'+src.replace(/"/g,'&quot;')+'" alt="Screenshot">';
    var b=document.createElement('button');b.className='lightbox-close';b.innerHTML='&times;';
    document.body.appendChild(o);document.body.appendChild(b);
  }
  function closeLightbox(){
    var o=document.querySelector('.lightbox-overlay');if(o)o.remove();
    var b=document.querySelector('.lightbox-close');if(b)b.remove();
  }

  /* ── Video ↔ All Panels Sync ── */
  var _videoSyncCleanup=null;
  function syncActionsWithVideo(){
    /* Clean up previous listener */
    if(_videoSyncCleanup){_videoSyncCleanup();_videoSyncCleanup=null;}
    var video=document.querySelector('.drawer-body video');
    if(!video)return;

    /* Action steps sync */
    var steps=document.querySelectorAll('.action-step.seekable');
    var offsets=[];
    for(var i=0;i<steps.length;i++){
      var o=parseFloat(steps[i].getAttribute('data-offset'));
      if(!isNaN(o))offsets.push({el:steps[i],offset:o});
    }
    offsets.sort(function(a,b){return a.offset-b.offset;});

    /* Collect console and network panels with video sync */
    var consolePanels=document.querySelectorAll('.console-panel');
    var ndtPanels=document.querySelectorAll('.ndt');

    var lastActive=null;
    function onTimeUpdate(){
      var ct=video.currentTime;

      /* Sync action steps */
      if(offsets.length){
        var match=null;
        for(var i=offsets.length-1;i>=0;i--){
          if(offsets[i].offset<=ct){match=offsets[i].el;break;}
        }
        if(match!==lastActive){
          if(lastActive)lastActive.classList.remove('action-active');
          if(match){
            match.classList.add('action-active');
            match.scrollIntoView({block:'nearest',behavior:'smooth'});
          }
          lastActive=match;
        }
      }

      /* Sync console panels */
      for(var ci=0;ci<consolePanels.length;ci++){
        if(consolePanels[ci].__videoSync)consolePanels[ci].__videoSync(ct);
      }

      /* Sync network panels */
      for(var ni=0;ni<ndtPanels.length;ni++){
        if(ndtPanels[ni].__videoSync)ndtPanels[ni].__videoSync(ct);
      }
    }
    video.addEventListener('timeupdate',onTimeUpdate);
    video.addEventListener('seeked',onTimeUpdate);
    _videoSyncCleanup=function(){
      video.removeEventListener('timeupdate',onTimeUpdate);
      video.removeEventListener('seeked',onTimeUpdate);
      if(lastActive)lastActive.classList.remove('action-active');
    };
  }

  /* ── Filter Drawer ── */
  function openFilterDrawer(){
    var d=document.getElementById('filter-drawer');if(d)d.classList.add('open');
    var b=document.getElementById('filter-drawer-backdrop');if(b)b.classList.add('open');
  }
  function closeFilterDrawer(){
    var d=document.getElementById('filter-drawer');if(d)d.classList.remove('open');
    var b=document.getElementById('filter-drawer-backdrop');if(b)b.classList.remove('open');
  }

  applyTheme();
  renderRunMeta();
  renderSummary();
  initFilters();
  renderFilterBar();
  renderTestGrid();
  checkServer(function(ok){});
  var _lo=document.getElementById('loading-overlay');if(_lo)_lo.remove();
})();</script>
</body>
