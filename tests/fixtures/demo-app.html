<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo Test App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .hidden { display: none; }
    .panel { border: 1px solid #ddd; padding: 20px; max-width: 420px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="panel" id="login-panel">
    <h2>Login</h2>
    <form id="login-form">
      <label>Username<br /><input id="username" name="username" /></label><br /><br />
      <label>Password<br /><input id="password" name="password" type="password" /></label><br /><br />
      <button type="submit">Login</button>
      <div id="login-message" role="status"></div>
    </form>
  </div>

  <div class="panel hidden" id="dashboard-panel">
    <h2>Dashboard</h2>
    <button id="checkout-button">Checkout</button>
    <div id="checkout-result" class="success" role="status"></div>

    <h3>Search</h3>
    <input id="search-input" placeholder="Search product" />
    <div id="search-result"></div>
  </div>

  <script>
    const VALID_USER = 'user@example.com';
    const VALID_PASSWORD = 'password123';
    const loginForm = document.getElementById('login-form');
    const message = document.getElementById('login-message');
    const dashboard = document.getElementById('dashboard-panel');
    const loginPanel = document.getElementById('login-panel');
    const checkoutResult = document.getElementById('checkout-result');
    const searchResult = document.getElementById('search-result');

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === VALID_USER && password === VALID_PASSWORD) {
        message.textContent = 'Login successful';
        message.className = 'success';
        loginPanel.classList.add('hidden');
        dashboard.classList.remove('hidden');
        checkoutResult.textContent = '';
        searchResult.textContent = '';
      } else {
        message.textContent = 'Invalid credentials';
        message.className = 'error';
      }
    });

    document.getElementById('checkout-button').addEventListener('click', () => {
      checkoutResult.textContent = 'Checkout completed successfully.';
    });

    document.getElementById('search-input').addEventListener('input', (event) => {
      const value = event.target.value.toLowerCase();
      if (!value) {
        searchResult.textContent = '';
        return;
      }
      if (value.includes('apple')) {
        searchResult.textContent = 'Found 1 product: Apple AirPods';
      } else {
        searchResult.textContent = 'No products found.';
      }
    });
  </script>
</body>
</html>
